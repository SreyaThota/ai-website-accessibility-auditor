name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Linting and Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black

      - name: Install Playwright Chromium dependencies
        run: |
          playwright install --with-deps chromium

      - name: Check code formatting with Black
        run: |
          black --check --line-length 120 auditor/ backend/ frontend/ tests/ || true

      - name: Lint with Flake8
        run: |
          flake8 auditor/ backend/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest test suite
        run: |
          pytest tests/ -v
